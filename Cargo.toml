[workspace]
resolver = "2"
members = ["crates/core"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/openfrontio/OpenFrontIO"

[workspace.dependencies]
openfront-core = { path = "crates/core" }

# The determinism layer must never be optimised in a way that reassociates
# float maths, and release profiles are where such flags get turned on. Keep
# overflow behaviour explicit so a debug/release mismatch cannot silently
# change simulation results.
[profile.release]
overflow-checks = true
debug = 1
